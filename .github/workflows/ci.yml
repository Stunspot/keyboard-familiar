name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Static import check
        run: python -m compileall -q familiar tests
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - name: CLI smoke tests
        run: |
          python -m familiar.cli --help
          python -m familiar.cli setup --destination .familiar/user-config
          python -m familiar.cli preview --runtime-file .familiar/ci.json
          python -m familiar.cli doctor --simulate
          python -m familiar.cli show "CI glance" --simulate --runtime-file .familiar/ci.json
          python -m familiar.cli show "CI alert" --alert --simulate --runtime-file .familiar/ci.json
          python -m familiar.cli focus start "CI focus" --minutes 5 --simulate --runtime-file .familiar/ci.json
          python -m familiar.cli focus status --runtime-file .familiar/ci.json
          python -m familiar.cli focus stop --simulate --runtime-file .familiar/ci.json
          python -m familiar.cli render dry-run --runtime-file .familiar/ci.json
