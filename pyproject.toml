[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyboard-familiar"
version = "0.1.0"
description = "A quiet glance deck and alert layer for SteelSeries keyboards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "nvidia-ml-py>=12.0",
  "psutil>=6.0",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.11",
]

[project.scripts]
familiar = "familiar.cli:app"

[tool.setuptools.packages.find]
include = ["familiar*"]
exclude = ["config*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
