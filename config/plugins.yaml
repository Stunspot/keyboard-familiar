plugins:
  manual_trigger:
    enabled: true
  timer:
    enabled: false
    every_seconds: 30
  glance_deck:
    enabled: true
  gpu_vram:
    enabled: true
    every_seconds: 3
    gpu_index: 0
    change_threshold_pct: 2.0
    alert_threshold_pct: 75.0
  rules_basic:
    enabled: true
  console_debug:
    enabled: true
  steelseries:
    enabled: true
    mode: gamesense
    capabilities: [screen, function_key_lighting]
    alert_color: [255, 64, 32]
    timeout_seconds: 2.0
