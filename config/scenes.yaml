# Architecture reference retained for compatibility. Runtime scene policy lives
# in familiar/core/scenes.py; min dwell is configurable in app.yaml.
scenes:
  GLANCE:
    dwell_ms: 10000
  ALERT:
    dwell_ms: 15000
    preempts: [GLANCE, ART]
  INSPECT:
    dwell_ms: 30000
  ART:
    dwell_ms: 120000
    only_when_idle: true
